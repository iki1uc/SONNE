<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>use() – iki1uc Operator</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:monospace;
    padding:20px;
}
pre {
    background:#111;
    padding:10px;
    border:1px solid #333;
}
button {
    background:#111;
    border:1px solid #0f0;
    color:#0f0;
    padding:6px 12px;
    margin:6px;
    cursor:pointer;
}
button:hover {
    background:#0f0;
    color:#000;
}
#out {
    margin-top:20px;
    white-space:pre;
}
</style>
</head>

<body>

<h2>use(user(lage(respo(argumenteria,myWIKI),formeln),fähigkeiten))</h2>

<button onclick="runUse()">use()</button>

<pre id="out">bereit.</pre>

<script>
// ─────────────────────────────────────────────
//  iki1uc MODULES – NC‑Industry‑Ready
// ─────────────────────────────────────────────

const MODULES = {
    LAGE: ["W","S","A","D","Q","R","Y","C","X"],
    RESPO: ["Struktur", "Ordnung", "Wirkung"],
    ARGUMENT: ["Klarheit", "Integrität"],
    WIKI: "Formeln sichtbar (neutral)",
    TMP: "TMP‑LAGE: aktiv",
    GHOST: "GHOST‑SCAN: bereit",
    FINAL: "reFINAL: +1 System‑Reingewinn"
};

// Formatierer (sauber, modular)
function formatList(label, arr){
    return `${label}: ${arr.join(" + ")}`;
}

// Hauptfunktion
function runUse() {

    const out =
        "use() aktiv\n" +
        "──────────────────────────────\n" +
        formatList("LAGE", MODULES.LAGE) + "\n" +
        formatList("RESPO", MODULES.RESPO) + "\n" +
        formatList("Argumenteria", MODULES.ARGUMENT) + "\n" +
        "myWIKI: " + MODULES.WIKI + "\n" +
        MODULES.TMP + "\n" +
        MODULES.GHOST + "\n" +
        MODULES.FINAL;

    document.getElementById("out").textContent = out;
}
</script>

</body>
</html>
